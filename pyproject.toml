[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sakhalkar-datastructure"
version = "0.1.0"
description = "Data structures implementing from scratch in python"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Rohit sakhalkar"}
]

[project.optional-dependencies]
dev = [
    "pytest"
]